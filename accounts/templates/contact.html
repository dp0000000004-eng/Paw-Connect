

{% extends 'layout.html' %}

{% load static %}


{% block title %}
    Contact
{% endblock %}

{% block body %}
    <main class="page contact-page">
        <h1>Contact</h1>
        <address class="contact-details">
            <p>
                <span>College email</span>
                <a href="mailto:{{ datas.email }}">{{ datas.email }}</a>
            </p>
            <p>
                <span>College phone</span>
                <a href="tel:{{ datas.contact_no }}">{{ datas.contact_no }}</a>
            </p>
        </address>
    </main>
    <br>
    <br>
{% endblock %}
