{% extends 'layout.html' %}

{% block title %}
    Exams
{% endblock %}

{% block body %}
<main class="page">
    <h1>Departments</h1>
    <div class="table-scroll" role="region" aria-label="Departments" tabindex="0">
        <table class="data-table">
            <thead>
                <tr>
                    <th scope="col">ID</th>
                    <th scope="col">Department</th>
                </tr>
            </thead>
            <tbody>
                {% for branch in branches %}
                    <tr>
                        <td>{{ branch.id }}</td>
                        <td><a href="{% url 'exam:syllabus' branch.id %}">{{ branch.name }}</a></td>
                    </tr>
                {% empty %}
                    <tr>
                        <td colspan="2">No departments are available yet.</td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</main>
{% endblock %}
