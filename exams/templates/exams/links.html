{% extends 'layout.html' %}

{% block title %}
    Exams
{% endblock %}

{% block body %}
<style>
    table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 1rem;
        background: #1683FF;
    }

    th, td {
        padding: 0.75rem;
        border: 1px solid black;
        text-align: left;
    }

    tr:first-child {
        background: black;
        font-weight: bold;
    }

    

    a {
        color: black;
        text-decoration: none;
    }
</style>
<section class="page">
    <table>
        <tr>
            <td>Id</td>
            <td>semester</td>
            <td>Link</td>
        </tr>

        {% for syllabus in syllabuses %}
            <tr>
                <td>{{ syllabus.id }}</td>
                <td>{{ syllabus.semester }}  <sup>th</sup> Semester </td>
                <td><a href="{{ syllabus.link }}" target="_blank"><i class="fa-solid fa-download"></i>   </a></td>
                    
            </tr>
        {% endfor %}
    </table>
</section>
{% endblock %}
