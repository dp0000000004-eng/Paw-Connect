<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 80" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Wordmark -->
  <text x="0" y="52" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-weight="700" fill="#f2ede3">Paw</text>
  <text x="88" y="52" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-weight="700" fill="#ef9f27">Byte</text>

  <!-- paw-shaped dot replacing a letter accent, placed above the "i" of Byte... 
       since PawByte has no dot letter, use it as a decorative mark above the space between words -->
  <g transform="translate(80,4) scale(0.55)">
    <ellipse cx="10" cy="14" rx="7" ry="5.5" fill="#ef9f27"/>
    <ellipse cx="1" cy="4" rx="3" ry="3.6" fill="#ef9f27"/>
    <ellipse cx="8" cy="-1" rx="3" ry="3.6" fill="#ef9f27"/>
    <ellipse cx="15" cy="-1" rx="3" ry="3.6" fill="#ef9f27"/>
    <ellipse cx="21" cy="4" rx="3" ry="3.6" fill="#ef9f27"/>
  </g>

  <!-- underline claw-mark accent -->
  <g stroke="#ef9f27" stroke-width="2.5" stroke-linecap="round" fill="none">
    <path d="M2 66 L26 60"/>
    <path d="M10 68 L34 62"/>
    <path d="M18 70 L42 64"/>
  </g>
</svg>
