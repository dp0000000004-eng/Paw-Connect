{% load static %}


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <!-- Plugin title -->

    <title>
        {% block title %}

        {% endblock %}
    </title>

    <link rel="stylesheet" href="{% static 'css/main.css' %}">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=NTR&display=swap');
    </style>
    <link rel="icon" type="image/svg+xml" href="{% static 'images/paw.svg' %}">

    {% block style %}

    {% endblock %}

</head>
<body>
    <section class="sec-nav">
        <header class="navbar">
            <div class="logo" id="logo">
                PawByte
            </div>
            <nav class="navLinks">
                <a id="navEl" href="{% url 'user:home' %}" class="">Home</a>
                <a id="navEl" href="{% url 'user:about' %}" class="">About</a>
                <a id="navEl" href="{% url 'user:feedback' %}" class="" >Feedback</a>
                <a id="navEl" href="#" class="" >Contact</a>
            </nav>
            <div class="nav__right">
            {% if user.is_authenticated %}
                <a href="{% url 'user:logout' %}" title="Account settings">
                    <span class="nav__avatar">{{ user.username|slice:":1"|upper }}</span>
                </a>
            {% else %}
                <a href="{% url 'user:login' %}" class="profile-circle">Login</a>
            {% endif %}
             </div>
        </header>
    </section>
        <hr class="slimline">

    <!-- Plugin Body -->
    {% block body %}
    {% endblock %}
    <script src="{% static 'components/NavLink.js' %}"></script>


</body>
</html>
